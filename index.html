<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Bchange Lite v2 - Realtime Crypto Assets & AI Forecast</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B0F17">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Top Application Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">B</div>
        <div class="brand-title">Bchange <span>v2.0 Lite</span></div>
      </a>

      <div class="header-actions">
        <!-- Live Realtime Search Bar -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search assets by name or symbol (e.g. BTC, ETH, AVAX)..." />
        </div>

        <!-- Live Ticker Connection Pill -->
        <div class="live-status-pill">
          <span class="pulse-dot"></span>
          <span id="roiDuration">ROI Tracked (0 sec)</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Toolbar: Categorized Navigation & View Mode Controls -->
  <div class="toolbar-section">
    <div class="categories-bar" id="categoriesBar">
      <!-- Category pills injected dynamically -->
    </div>

    <div class="view-toggle">
      <button class="view-btn active" id="viewGridBtn" title="Grid View">📱 Grid</button>
      <button class="view-btn" id="viewListBtn" title="List View">📄 List</button>
    </div>
  </div>

  <!-- Main Content Area: Asset Cards / List Table -->
  <main class="main-content">
    <div id="assetsContainer" class="assets-grid">
      <!-- Loaded dynamically by app.js -->
    </div>
  </main>

  <!-- Modular Scripts -->
  <script src="./categories.js"></script>
  <script src="./chart.js"></script>
  <script src="./ai-research.js"></script>
  <script src="./app.js"></script>
</body>
</html>
